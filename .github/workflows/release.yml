#
# Builds se-cmd and publishes the tool itself on a GitHub release.
#
# Tagging is the trigger. There is nothing to pack here: se-cmd is a command
# line, not a library, and everything a caller would reference lives in NIFBX,
# SKAssets and HKX2 and is already on the feed. So what comes out is the program
# -- one archive, everything in it, nothing to install first.
#
# Windows only, and that is not an oversight. mopper.exe is a 32-bit Windows
# executable and MOPP collision is not optional for the meshes that carry it, so
# Windows is the only platform where "everything necessary to run it" is a whole
# sentence. It runs elsewhere under Wine, which is a thing to set up rather than
# a thing to ship, and anyone doing that can build from source.
#
# There are no tests in this repository either. Every test was a test of the
# conversion and went with it; they run in NIFBX and in SKAssets, off the
# packages this build restores. The build job is here to catch the thing that
# does break on a runner and not on a desk: a reference that only resolves
# because of what happens to be beside the clone.
#
# Use workflow_dispatch to build and publish without releasing anything.
#
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # NIFBX, HKX2 and SKAssets.Export come from GitHub Packages, and
      # nuget.config takes the credentials from the environment. Read is enough:
      # this repository publishes nothing to the feed.
      - name: Restore
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

  #
  # On Windows, so the archive is checked by the platform it is for. A cross
  # publish from Linux produces the same bytes and cannot say whether they
  # start, and the one thing worth knowing about a self-contained build is
  # exactly that.
  #
  release:
    needs: build
    runs-on: windows-latest

    permissions:
      contents: write   # to create the release
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Work out the version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"

            # Four parts as well as three: this repository has tagged
            # vMAJOR.MINOR.PATCH.BUILD since it began and there is no package
            # version to keep strictly semver for.
            pattern='^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            if [[ ! "$version" =~ $pattern ]]; then
              echo "tag '${GITHUB_REF#refs/tags/}' is not a version." \
                   "Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH.BUILD," \
                   "optionally with a prerelease suffix, e.g. v0.1.6.0" >&2
              exit 1
            fi

            publish=true
          else
            # Not a release: still publish and check it, so a packaging problem
            # shows up here rather than on the tag.
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
            publish=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version $version, publish $publish"

      #
      # Self-contained, so the archive is the whole tool. A framework-dependent
      # build is a tenth of the size and asks whoever unpacks it to go and
      # install a matching .NET first, which for the audience this is aimed at
      # is a worse trade.
      #
      # mopper.exe comes along with it -- Mopper.Native puts it beside the
      # binary, which is where NIFBX looks for it.
      #
      # Published into a folder named for the version so the archive expands
      # into one, rather than emptying itself into wherever it was opened.
      #
      - name: Publish
        shell: pwsh
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $folder = "publish/se-cmd-$version"

          dotnet publish se-cmd.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:Version=$version `
            -p:RepositoryUrl=https://github.com/${{ github.repository }} `
            -o $folder
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path $folder -DestinationPath "artifacts/se-cmd-$version-win-x64.zip"

      #
      # Both executables are started, because both have to work and they fail
      # differently: se-cmd itself if the self-contained runtime is laid down
      # wrong, and mopper if the 32-bit binary did not come along or the runner
      # cannot run it. Either builds clean and dies on first use.
      #
      - name: Check the artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = "publish/se-cmd-${{ steps.version.outputs.version }}"

          & "$folder/se-cmd.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "se-cmd.exe did not run" }

          & "$folder/mopper.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "mopper.exe did not run" }

          Get-ChildItem artifacts/*.zip
          if ((Get-ChildItem artifacts/*.zip).Count -ne 1) { throw "expected one archive" }

      - uses: actions/upload-artifact@v4
        with:
          name: se-cmd-${{ steps.version.outputs.version }}
          path: artifacts/*.zip
          if-no-files-found: error

      #
      # Created with gh rather than an action, for the retries. GitHub's release
      # API answers 500 on this account often enough that it is the normal case
      # rather than the exception -- three of the four releases made so far
      # failed on it -- and it clears in a minute or two. The action gives up
      # after three tries a couple of seconds apart, which is exactly the wait
      # that does not work.
      #
      # A create that reports failure can still have made the release, so each
      # round looks before trying again and finishes by uploading into whatever
      # is already there.
      #
      - name: Create the GitHub release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail

          tag="${GITHUB_REF#refs/tags/}"
          notes=(--generate-notes --title "se-cmd $VERSION")

          case "$VERSION" in *-*) notes+=(--prerelease);; esac

          for wait in 0 30 60 90 120 180; do
            [ "$wait" -gt 0 ] && sleep "$wait"

            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" artifacts/*.zip --clobber && exit 0
            elif gh release create "$tag" artifacts/*.zip "${notes[@]}"; then
              exit 0
            fi

            echo "::warning::the release API did not answer; trying again" >&2
          done

          echo "::error::could not create the release for $tag" >&2
          exit 1
